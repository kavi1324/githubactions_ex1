# WORKFLOW 05 - Using secrets safely (basic)
# Purpose: pass API keys/passwords without writing them in code.
# Setup: Repo -> Settings -> Secrets and variables -> Actions -> New secret
#        Create a secret named MY_API_KEY.

name: 05 Using Secrets

on: [workflow_dispatch]

jobs:
  use-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Use secret via env variable (recommended way)
        env:
          # Secrets are read with the "secrets" context.
          API_KEY: ${{ secrets.MY_API_KEY }}
        run: |
          # GitHub automatically masks secret values in logs (shows ***).
          # NEVER print real secrets on purpose - this is just a demo.
          if [ -z "$API_KEY" ]; then
            echo "Secret MY_API_KEY is not set"
          else
            echo "Secret is set, length: ${#API_KEY}"   # print length, not value
          fi
